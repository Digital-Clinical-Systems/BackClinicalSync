spring.application.name=clinicalsync-platform

# Configuration Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/clinicalsync?createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.username=${DB_USERNAME:root}

# Configuration JPA
spring.jpa.database=mysql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

# Configuration Web (fixed locale so validation messages are stable for the client)
spring.web.locale=en
spring.web.locale-resolver=fixed

# Configuration Authorization (JWT)
authorization.jwt.secret=${JWT_SECRET:local-development-only-secret-change-me-in-every-deployment}
authorization.jwt.expiration.days=${JWT_EXPIRATION_DAYS:7}

# Configuration CORS (comma-separated origins)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Configuration Seeding
clinicalsync.seed.demo-data=${SEED_DEMO_DATA:true}
clinicalsync.seed.demo-users-password=${DEMO_USERS_PASSWORD:ClinicalSync2026}
